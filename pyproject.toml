[project]
name = "test-task-event-management"
version = "0.1.0"
description = ""
authors = [
    {name = "vlchshn",email = "vlchshn.code@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "django (>=6.1,<7.0)",
    "djangorestframework (>=3.18.0,<4.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "django-filter (>=26.1,<27.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "djangorestframework-stubs (>=3.18.0,<4.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "ruff (>=0.16.3,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "RUF"]
per-file-ignores = { "*/migrations/*.py" = ["RUF012", "E501"], "*/views.py" = ["RUF012"], "*/serializers.py" = ["RUF012"] }
